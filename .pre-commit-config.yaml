# Fast local checks. The authoritative gate is CI (see ADR-0006) — these hooks
# exist to catch the cheap failures before they reach it, not to replace it.
#
#   uv run pre-commit install     (from backend/, once)
#   uv run pre-commit run -a      (to run everything on demand)

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Type checking runs through uv so it uses the locked environment rather than
  # a mirror of the dependency set that pre-commit would otherwise maintain.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --project backend --no-sync mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
