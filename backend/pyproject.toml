[project]
name = "paimon"
version = "0.1.0"
description = "An AI Operations Platform for engineering organizations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Sergio Medina" }]

# Runtime dependencies are declared with lower bounds only. Exact, transitively
# resolved versions live in uv.lock, which is the reproducibility guarantee.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    # The checkpointer depends on bare psycopg, which ships no libpq wrapper and
    # fails to import until one is present. Naming the binary extra here rather
    # than discovering it at runtime: a transitive dependency that cannot be
    # imported as installed is a broken install, not a configuration choice.
    "psycopg[binary]>=3.2.0",
    "mcp>=2.1.1",
    # Tracing. The SDK and an OTLP exporter, and nothing vendor-specific: every
    # backend this platform might send traces to — Langfuse, Azure Monitor, a
    # collector — speaks OTLP, so the destination is configuration rather than a
    # dependency (ADR-0025). The instrumentation packages carry a 0.x version
    # because that is the versioning scheme OpenTelemetry uses for them, not
    # because they are unfinished.
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
]

# Entra ID authentication. Optional: a deployment using service keys needs
# none of it, and it pulls a large dependency tree.
[project.optional-dependencies]
azure = ["azure-identity>=1.19.0"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "import-linter>=2.14",
    "pre-commit>=4.6.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paimon"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations
    "ASYNC",     # flake8-async
    "BLE",       # flake8-blind-except
    "S",         # flake8-bandit
    "B",         # flake8-bugbear
    "FBT",       # flake8-boolean-trap
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez
    "T20",       # flake8-print
    "PT",        # flake8-pytest-style
    "RET",       # flake8-return
    "SIM",       # flake8-simplify
    "TID",       # flake8-tidy-imports
    "ARG",       # flake8-unused-arguments
    "PTH",       # flake8-use-pathlib
    "ERA",       # eradicate
    "PL",        # pylint
    "RUF",       # ruff-specific
]
ignore = [
    "D203",      # conflicts with D211
    "D213",      # conflicts with D212
    "ANN401",    # typing.Any is sometimes the honest annotation
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic numbers and take fixtures they do not read.
"tests/**/*.py" = ["S101", "D", "ANN", "ARG", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports hide which layer a module belongs to.
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy — strict from the first commit
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "migrations"]
# The architecture fixture is a standalone package that is only importable
# from its own directory, which is where the checker under test runs it.
exclude = ["tests/architecture/fixtures/"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Every ignore must name the rule it silences, so it can be found and removed.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A warning nobody reads is a defect waiting its turn. Anything expected is
# silenced explicitly, with a reason, rather than left to scroll past.
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure logic, no external process",
    "integration: requires PostgreSQL and Redis",
    "e2e: exercises the running application end to end",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/paimon"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
]

# ---------------------------------------------------------------------------
# Import Linter — the dependency rule, enforced (ADR-0002)
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "paimon"
# Required so that third-party packages can appear in forbidden_modules:
# keeping frameworks out of the domain is the point of the rule.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "paimon.interfaces",
    "paimon.evaluation",
    "paimon.agents",
    "paimon.application",
    "paimon.rag",
    "paimon.domain",
]

[[tool.importlinter.contracts]]
name = "The domain depends on nothing"
type = "forbidden"
source_modules = ["paimon.domain"]
forbidden_modules = [
    "paimon.application",
    "paimon.agents",
    "paimon.infrastructure",
    "paimon.interfaces",
    "paimon.rag",
    "paimon.evaluation",
    "paimon.config",
    "paimon.observability",
    "fastapi",
    "sqlalchemy",
    "redis",
    "httpx",
    "jwt",
]

[[tool.importlinter.contracts]]
name = "Infrastructure knows only the domain"
type = "forbidden"
source_modules = ["paimon.infrastructure"]
forbidden_modules = [
    "paimon.application",
    "paimon.agents",
    "paimon.interfaces",
    "paimon.rag",
    "paimon.evaluation",
]

# The composition root is the one place where concrete adapters are bound to
# domain ports, so it is the one module permitted to import infrastructure.
[[tool.importlinter.contracts]]
name = "Infrastructure is reached only through the composition root"
type = "forbidden"
source_modules = ["paimon.interfaces", "paimon.evaluation", "paimon.agents"]
forbidden_modules = ["paimon.infrastructure"]
# Recursive: a single star matches one segment, so it stopped covering
# paimon.infrastructure.azure.openai the moment an adapter grew a sub-package.
ignore_imports = ["paimon.interfaces.api.dependencies -> paimon.infrastructure.**"]

# ADR-0015: node bodies are plain async functions over a plain dataclass. This
# is the contract that keeps that true, and it fails the build the day someone
# reaches for a StateGraph inside a node instead of inside the adapter.
[[tool.importlinter.contracts]]
name = "Agent logic does not import the orchestration framework"
type = "forbidden"
source_modules = ["paimon.agents", "paimon.domain.agents"]
forbidden_modules = ["langgraph", "langchain", "langchain_core"]

# Use cases receive what they need as arguments. A use case that reads settings
# directly is a use case that cannot be tested without an environment.
[[tool.importlinter.contracts]]
name = "Use cases do not read configuration"
type = "forbidden"
source_modules = ["paimon.application", "paimon.rag", "paimon.evaluation", "paimon.agents"]
forbidden_modules = ["paimon.config"]
